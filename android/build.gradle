// Top-level build file for the Android Gradle build
// This file is used by OpenFL/Lime when generating the Android project

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The actual app module build.gradle is generated by Lime into export/android/bin
// This template is here for reference and customization.
